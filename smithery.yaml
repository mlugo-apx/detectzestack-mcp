# Smithery configuration file: https://smithery.ai/docs/config#smitheryyaml

startCommand:
  type: stdio
  configSchema:
    type: object
    # Provide ONE of the three keys. None is individually required, so a
    # direct DetectZeStack key works without a RapidAPI account (1.1.0).
    properties:
      rapidApiKey:
        type: string
        description: RapidAPI key for DetectZeStack (optional if you use a direct key). Get one at https://rapidapi.com/mlugoapx/api/detectzestack
      apiMarketKey:
        type: string
        description: API.market key (optional alternative)
      directApiKey:
        type: string
        description: Direct DetectZeStack API key from https://detectzestack.com/signup (free tier 100 requests/month)
  commandFunction: |-
    (config) => ({
      command: 'npx',
      args: ['-y', 'detectzestack-mcp'],
      env: {
        ...(config.rapidApiKey ? { RAPIDAPI_KEY: config.rapidApiKey } : {}),
        ...(config.apiMarketKey ? { APIMARKET_KEY: config.apiMarketKey } : {}),
        ...(config.directApiKey ? { DETECTZESTACK_API_KEY: config.directApiKey } : {})
      }
    })
  exampleConfig:
    directApiKey: "your-detectzestack-key-here"
