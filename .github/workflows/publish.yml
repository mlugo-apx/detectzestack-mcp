# Publishes to npm via trusted publishing (OIDC) when a v* tag is pushed.
# No npm token or OTP: npm trusts this workflow for package detectzestack-mcp.
# Tests must pass before publish.
name: publish
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: tag matches package.json version
        run: test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"
      - run: npm publish --provenance --access public
      # --- MCP Registry (GitHub OIDC login, no secrets) ---
      - name: wait for npm to serve this version (registry verifies mcpName on npm)
        run: |
          V=$(node -p "require('./package.json').version")
          for i in $(seq 1 30); do
            npm view "detectzestack-mcp@$V" mcpName 2>/dev/null | grep -q "io.github.mlugo-apx/detectzestack-mcp" && exit 0
            sleep 10
          done
          echo "npm never served detectzestack-mcp@$V with mcpName"; exit 1
      - name: install mcp-publisher
        run: curl -sL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
      - name: login to MCP Registry (GitHub OIDC)
        run: ./mcp-publisher login github-oidc
      - name: publish server.json to MCP Registry
        run: ./mcp-publisher publish
